name: Public source security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reject tracked local credentials and connection files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env($|\.)|^supabase/\.(temp|backup|ignore)/|\.(pem|key|p12|pfx|dump|backup|sql\.gz)$' | grep -vE '(^|/)\.env\.example$'; then
            echo 'Private local configuration or export files must not be tracked.'
            exit 1
          fi
      - name: Install pinned Gitleaks with checksum verification
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan complete checked-out source with redacted output
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/public-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/public-source"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/public-source" --config "$GITHUB_WORKSPACE/.gitleaks.toml" --redact=100 --no-banner
